# carverauto fork only: build multi-arch images and push them to Harbor.
# Lives on the `carverauto` integration branch so `main` can track google/ax.
name: carverauto images

on:
  push:
    branches: [carverauto]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.carverauto.dev
  PROJECT: ax
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  images:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require Harbor robot credentials
        env:
          HARBOR_ROBOT_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
        run: |
          if [ -z "$HARBOR_ROBOT_USERNAME" ] || [ -z "$HARBOR_ROBOT_SECRET" ]; then
            echo "Missing Harbor robot credentials. Set HARBOR_ROBOT_USERNAME and HARBOR_ROBOT_SECRET." >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      # The ARC runners run in Kubernetes mode and have no Docker daemon, so
      # everything is built with ko, which pushes straight to the registry.
      # ax-task-runner uses the base image upstream sets in .ko.yaml
      # (alpine/git). The Python/Antigravity image from Dockerfile.task-runner
      # needs a Docker daemon and is not built here.
      - uses: ko-build/setup-ko@v0.9

      - name: Build and push images
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.PROJECT }}
        run: |
          for c in ax-controller ax-server ax-task-runner; do
            ko build --platform="$PLATFORMS" --base-import-paths \
              --tags "${GITHUB_SHA::12}" --tags latest "./cmd/$c" | tee -a images.txt
          done
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/; s/$/`/' images.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every image has both architectures
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          for i in ax-controller ax-server ax-task-runner; do
            ref="$REGISTRY/$PROJECT/$i:${GITHUB_SHA::12}"
            archs=$("$(go env GOPATH)/bin/crane" manifest "$ref" | jq -r '[.manifests[].platform.architecture] | unique | sort | join(",")')
            echo "$ref -> $archs ($("$(go env GOPATH)/bin/crane" digest "$ref"))"
            case "$archs" in *amd64*arm64*) ;; *) echo "missing an architecture" >&2; exit 1;; esac
          done
